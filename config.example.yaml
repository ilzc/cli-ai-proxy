# CLI AI Proxy 配置

server:
  host: "127.0.0.1"
  port: 9090

# Session 管理
session:
  ttl: 1800  # 秒，默认 30 分钟

# 并发控制
concurrency:
  max: 5        # 最多同时运行的 CLI 进程数
  maxQueued: 50 # 排队上限，超出直接 429

# CLI 进程超时（毫秒），默认 5 分钟
timeout: 300000

# 默认模型（未指定 model 时使用）
defaultModel: "gemini"

# CLI 工具路径（留空则使用 PATH 中的命令）
cli:
  gemini: ""      # 例如 /usr/local/bin/gemini
  claude: ""      # 例如 /usr/local/bin/claude

# 模型别名映射
# 格式：别名 → { provider, model }
# model 设为 "default" 则使用 CLI 自身的默认模型（推荐）
# model 也可指定 CLI 认识的具体模型名（如 sonnet, opus）
models:
  gemini:
    provider: "gemini"
    model: "default"            # CLI 默认模型（随 CLI 更新自动升级）
  claude:
    provider: "claude"
    model: "default"            # CLI 默认模型
  claude-sonnet:
    provider: "claude"
    model: "sonnet"             # 明确指定 sonnet
  claude-opus:
    provider: "claude"
    model: "opus"               # 明确指定 opus
